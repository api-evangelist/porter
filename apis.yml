apis:
- aid: porter:porter-mixins-api
  name: Porter Mixins API
  description: >-
    Extension interface for building and using mixins, which are the building blocks for authoring Porter
    bundles. Mixins provide pre-built integrations for interacting with tools and services such as Kubernetes,
    Helm, Terraform, and Docker Compose from within a bundle action.
  humanURL: https://porter.sh/mixins/
  baseURL: https://porter.sh
  tags:
  - CNAB
  - DevOps
  - Extensions
  - Mixins
  - Plugins
  properties:
  - type: Documentation
    url: https://porter.sh/mixins/
  - type: Reference
    url: https://porter.sh/docs/development/dev-a-mixin/
- aid: porter:porter-plugins-api
  name: Porter Plugins API
  description: >-
    Plugin interface that allows extending Porter's core functionality, such as storing installation data,
    credential sets, and parameter sets in external systems like cloud storage instead of the local filesystem.
    Plugins reimplement Porter's default behavior to integrate with enterprise or cloud infrastructure.
  humanURL: https://porter.sh/docs/introduction/concepts-and-components/mixins-vs-plugins/
  baseURL: https://porter.sh
  tags:
  - Cloud Native
  - CNAB
  - DevOps
  - Extensions
  - Plugins
  properties:
